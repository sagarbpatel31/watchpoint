services:
  - type: web
    name: watchpoint-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard from Supabase
      - key: CORS_ORIGINS
        value: https://watchpoint-gray.vercel.app,http://localhost:3000,http://localhost:3001
      - key: JWT_SECRET_KEY
        generateValue: true  # Render will generate a secure random value
      - key: STORAGE_PATH
        value: /tmp/storage
      - key: ANTHROPIC_API_KEY
        sync: false  # paste from console.anthropic.com — enables LLM incident summaries
      - key: ENABLE_DEMO_SEED
        value: "false"  # POST /seed/demo returns 404. To seed the public demo once:
                        # flip to true in the Render dashboard, POST the endpoint,
                        # then flip back. Leaving it on lets anyone reset the demo.
      - key: PORT
        value: "8000"
